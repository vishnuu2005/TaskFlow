spring.application.name=taskflow
server.port=${PORT:8081}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/taskflow_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:dGFza2Zsb3ctc3VwZXItc2VjcmV0LWtleS0yNTYtYml0cy1sb25nLTIwMjY=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}