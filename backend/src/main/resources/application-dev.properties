spring.application.name=taskflow
server.port=${PORT:8081}

# In-memory H2 database with MySQL compatibility mode for local development
spring.datasource.url=jdbc:h2:mem:taskflow_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=dGFza2Zsb3ctc3VwZXItc2VjcmV0LWtleS0yNTYtYml0cy1sb25nLTIwMjY=
app.jwt.expiration-ms=3600000
